apiVersion: apps/v1
kind: Deployment
metadata:
  name: kokoro-tts
  namespace: tts
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kokoro-tts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kokoro-tts
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kokoro
          image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.6.0
          ports:
            - name: http
              containerPort: 8880
          env:
            - name: API_LOG_LEVEL
              value: INFO
          startupProbe:
            httpGet:
              path: /docs
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi

